name: momenria

x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - app
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:18.0-bookworm@sha256:3f55f8895c4ed50603e2fbdfc72fffeeaba3173321fee5cb825bbbeb30d9d854
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-momenria}
      POSTGRES_USER: ${POSTGRES_USER:-momenria_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app
    mem_limit: 1536m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-init:
    image: postgres:18.0-bookworm@sha256:3f55f8895c4ed50603e2fbdfc72fffeeaba3173321fee5cb825bbbeb30d9d854
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-momenria_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-momenria}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-momenria_migration}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?set MIGRATION_DB_PASSWORD}
      RUNTIME_DB_USER: ${RUNTIME_DB_USER:-momenria_runtime}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?set RUNTIME_DB_PASSWORD}
    command: ["sh", "/init/init-roles.sh"]
    volumes:
      - ./docker/init-roles.sh:/init/init-roles.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
    restart: "no"

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${MIGRATION_DB_USER:-momenria_migration}:${MIGRATION_DB_PASSWORD:?set MIGRATION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-momenria}
    command: ["python", "manage.py", "migrate", "--noinput"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - app
    restart: "no"

  collectstatic:
    build: .
    env_file: .env
    command: ["python", "manage.py", "collectstatic", "--noinput"]
    read_only: true
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app
    restart: "no"

  web:
    <<: *app
    environment:
      TRUSTED_PROXY_HOST: caddy
    depends_on:
      migrate:
        condition: service_completed_successfully
      collectstatic:
        condition: service_completed_successfully
    networks:
      - app
      - egress
    volumes:
      - source_media:/data/private/sources
      - result_media:/data/private/results
      - character_media:/data/private/characters
      - tombstone_data:/data/tombstones
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 1536m
    pids_limit: 256

  worker:
    <<: *app
    command: ["python", "manage.py", "runworker"]
    volumes:
      - source_media:/data/private/sources:ro
      - result_media:/data/private/results
      - character_media:/data/private/characters
    extra_hosts:
      - "nadzeriserver:host-gateway"
    networks:
      - app
      - egress
    mem_limit: 4g
    pids_limit: 256

  maintenance:
    <<: *app
    command: ["python", "manage.py", "maintenance"]
    volumes:
      - source_media:/data/private/sources
      - result_media:/data/private/results
      - character_media:/data/private/characters
      - tombstone_data:/data/tombstones:ro
    networks:
      - app
      - egress
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      APP_SITE_ADDRESS: ${APP_SITE_ADDRESS:-http://localhost}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      collectstatic:
        condition: service_completed_successfully
    networks:
      - app
      - egress
    mem_limit: 256m
    pids_limit: 128

volumes:
  postgres_data:
  source_media:
  result_media:
  character_media:
  static_data:
  caddy_data:
  caddy_config:
  tombstone_data:

networks:
  app:
    internal: true
  egress:
